name: cma_mcq_portal
description: CMA MCQ Portal Android wrapper with native Google Sign-In.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Use the current Android implementation. Older 7.2.x builds had
# Credential Manager/account-picker issues on some physical devices.
dependency_overrides:
  google_sign_in_android: 6.2.1
