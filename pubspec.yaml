name: cma_mcq_portal
description: CMA MCQ Portal Android wrapper with native Firebase email authentication.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.0.3
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
