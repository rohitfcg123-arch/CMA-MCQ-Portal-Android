name: Build CMA Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'admin_app/**'
      - '.github/workflows/build-admin-apk.yml'

permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: admin_app
        run: flutter create . --platforms=android --org com.taxpath --project-name cma_admin_portal
      - name: Set minimum SDK
        working-directory: admin_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          p.write_text(s)
          PY
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: admin_app
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/cma-release-key.jks
          test -s android/app/cma-release-key.jks
      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        working-directory: admin_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          block='''    signingConfigs {
              create("release") {
                  storeFile = file("cma-release-key.jks")
                  storePassword = System.getenv("KEYSTORE_PASSWORD")
                  keyAlias = "cma_mcq"
                  keyPassword = System.getenv("KEYSTORE_PASSWORD")
              }
          }
          '''
          s=s.replace('    buildTypes {',block+'    buildTypes {',1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
      - name: Add Internet permission
        working-directory: admin_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('</manifest>','<uses-permission android:name="android.permission.INTERNET"/>\n</manifest>')
          p.write_text(s)
          PY
      - name: Get dependencies
        working-directory: admin_app
        run: flutter pub get
      - name: Build Admin APK
        working-directory: admin_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: CMA-Admin-Portal-APK
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
