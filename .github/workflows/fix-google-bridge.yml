name: Fix Google Sign-In Bridge

on:
  push:
    paths:
      - .github/workflows/fix-google-bridge.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch native Google bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/main.dart")
          s = p.read_text()
          old = """            final uri = Uri.tryParse(url);
            if (uri != null && uri.host == 'rohitfcg123-arch.github.io') {
              await _controller.runJavaScript(_nativeGoogleBridge);
            }"""
          new = """            final uri = Uri.tryParse(url);
            if (uri != null &&
                (uri.host == 'rohitfcg123-arch.github.io' ||
                    uri.host == 'snackssangam.github.io')) {
              await _controller.runJavaScript(_nativeGoogleBridge);
            }"""
          if old not in s:
              raise SystemExit("Target block not found; no change made.")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix native Google Sign-In bridge injection"
          git push
