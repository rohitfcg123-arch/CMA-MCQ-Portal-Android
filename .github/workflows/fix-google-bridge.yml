name: Fix Google Sign-In Bridge

on:
  push:
    paths:
      - .github/workflows/fix-google-bridge.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch native Google bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/main.dart")
          s = p.read_text()
          import re
          pattern = re.compile(
              r"if (uri != null && uri\.host == 'rohitfcg123-arch\.github\.io') \{"
          )
          replacement = """if (uri != null &&
                (uri.host == 'rohitfcg123-arch.github.io' ||
                    uri.host == 'snackssang.github.io')) {"""
          if pattern.search(s):
              p.write_text(pattern.sub(replacement, s, count=1))
          else:
              print("Bridge already patched; nothing to change.")

          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix native Google Sign-In bridge injection"
          git push
