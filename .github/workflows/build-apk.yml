name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.taxpath \
            --project-name cma_mcq_portal

      - name: Configure Firebase / Google Sign-In
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 || secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64, re
          from pathlib import Path

          value = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "").strip()
          if not value:
              raise RuntimeError(
                  "Missing GOOGLE_SERVICES_JSON_BASE64 (or GOOGLE_SERVICES_BASE64) GitHub secret."
              )

          # Accept either raw JSON or Base64 JSON.
          if value.lstrip().startswith("{"):
              data = value
          else:
              value = re.sub(r"[^A-Za-z0-9+/=]", "", value)
              value += "=" * (-len(value) % 4)
              data = base64.b64decode(value, validate=True).decode("utf-8")

          out = Path("android/app/google-services.json")
          out.write_text(data, encoding="utf-8")

          if not out.exists() or out.stat().st_size < 100:
              raise RuntimeError("google-services.json was not restored correctly.")

          print("google-services.json restored.")

          # Flutter's generated Android project uses Kotlin DSL. Add the
          # Google Services Gradle plugin so the Android OAuth client from
          # google-services.json is available to google_sign_in.
          settings = Path("android/settings.gradle.kts")
          s = settings.read_text(encoding="utf-8")
          if 'id("com.google.gms.google-services") version "4.4.2" apply false' not in s:
              marker = 'plugins {'
              if marker not in s:
                  raise RuntimeError("Could not locate plugins block in android/settings.gradle.kts")
              s = s.replace(
                  marker,
                  marker + '\\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              settings.write_text(s, encoding="utf-8")

          app = Path("android/app/build.gradle.kts")
          a = app.read_text(encoding="utf-8")
          if 'id("com.google.gms.google-services")' not in a:
              marker = 'plugins {'
              if marker not in a:
                  raise RuntimeError("Could not locate plugins block in android/app/build.gradle.kts")
              a = a.replace(
                  marker,
                  marker + '\\n    id("com.google.gms.google-services")',
                  1
              )
              app.write_text(a, encoding="utf-8")
          PY

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import re
          from pathlib import Path

          value = os.environ["KEYSTORE_BASE64"]

          # Remove whitespace and any accidental non-Base64 characters.
          value = re.sub(r"[^A-Za-z0-9+/=]", "", value)

          # Add missing Base64 padding if necessary.
          value += "=" * (-len(value) % 4)

          keystore = base64.b64decode(value, validate=True)

          output = Path("android/app/cma-release-key.jks")
          output.write_bytes(keystore)

          if output.stat().st_size == 0:
              raise RuntimeError("Keystore file is empty")

          print(f"Keystore restored successfully: {output.stat().st_size} bytes")
          PY

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          signing_block = """
              signingConfigs {
                  create("release") {
                      storeFile = file("cma-release-key.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "cma_mcq"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }

          """

          if 'create("release")' not in s:
              s = s.replace(
                  "    buildTypes {",
                  signing_block + "    buildTypes {",
                  1
              )

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          p.write_text(s)
          PY

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  "</manifest>",
                  permission + "\n</manifest>"
              )

          p.write_text(s)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CMA-MCQ-Portal-APK
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error

# Google Sign-In bridge workflow made idempotent.
