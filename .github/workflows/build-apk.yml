name: Build APK
# Google OAuth release-signing verification build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.taxpath \
            --project-name cma_mcq_portal

      - name: Configure Android callback for browser login
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          callback_activity = '''
              <activity
                  android:name="com.linusu.flutter_web_auth_2.CallbackActivity"
                  android:exported="true"
                  android:taskAffinity="">
                  <intent-filter android:label="flutter_web_auth_2">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="cma-mcq-portal" />
                  </intent-filter>
              </activity>'''

          if 'com.linusu.flutter_web_auth_2.CallbackActivity' not in s:
              marker = "</application>"
              if marker not in s:
                  raise RuntimeError("Android application block not found")
              s = s.replace(marker, callback_activity + "\n" + marker, 1)

          # flutter_web_auth_2 5.x recommends an empty task affinity for all
          # exported auth-related activities, including MainActivity.
          main_marker = 'android:name=".MainActivity"'
          if main_marker in s:
              import re
              pattern = r'(<activity\\b[^>]*android:name="\\.MainActivity"[^>]*)(>)'
              match = re.search(pattern, s, flags=re.S)
              if match and 'android:taskAffinity=' not in match.group(1):
                  replacement = match.group(1) + ' android:taskAffinity=""' + match.group(2)
                  s = s[:match.start()] + replacement + s[match.end():]

          p.write_text(s)
          PY

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import re
          from pathlib import Path

          value = os.environ["KEYSTORE_BASE64"]

          # Remove whitespace and any accidental non-Base64 characters.
          value = re.sub(r"[^A-Za-z0-9+/=]", "", value)

          # Add missing Base64 padding if necessary.
          value += "=" * (-len(value) % 4)

          keystore = base64.b64decode(value, validate=True)

          output = Path("android/app/cma-release-key.jks")
          output.write_bytes(keystore)

          if output.stat().st_size == 0:
              raise RuntimeError("Keystore file is empty")

          print(f"Keystore restored successfully: {output.stat().st_size} bytes")
          PY

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          signing_block = """
              signingConfigs {
                  create("release") {
                      storeFile = file("cma-release-key.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "cma_mcq"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }

          """

          if 'create("release")' not in s:
              s = s.replace(
                  "    buildTypes {",
                  signing_block + "    buildTypes {",
                  1
              )

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          p.write_text(s)
          PY

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  "</manifest>",
                  permission + "\n</manifest>"
              )

          p.write_text(s)
          PY

      - name: Verify release signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android/app/cma-release-key.jks -storepass "$KEYSTORE_PASSWORD" -alias cma_mcq | grep -E "Alias name:|SHA1:|SHA256:"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CMA-MCQ-Portal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# Google Sign-In bridge workflow made idempotent.
